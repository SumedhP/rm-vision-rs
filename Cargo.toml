[package]
name = "auto_aim"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "RoboMaster auto-aim pipeline: detector, robot EKF, ballistics, logging and replay"
publish = false

[features]
# CUDA and TensorRT execution providers. Build with this on the Jetson; without it those backends report unavailable and the detector falls back to CPU.
gpu = ["ort/cuda", "ort/tensorrt"]

[dependencies]
nalgebra = { version = "0.35", features = ["serde-serialize"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ort = { version = "=2.0.0-rc.15", features = ["ndarray"] }
ndarray = "0.17"
foxglove = "0.30"
mcap = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
color-eyre = "0.6"
clap = { version = "4", features = ["derive"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
exhaustive_enums = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
